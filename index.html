<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prévision météo – Sénégal</title>

<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>

<style>
/* ===================== RESET DE BASE ===================== */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}

/* ===================== TITRE ===================== */
#titre-periode {
    margin: 0;
    padding: 10px 8px;
    font: bold 18px Arial, Helvetica, sans-serif;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
}

/* ===================== MESSAGE HAUT DROIT ===================== */
.message-info {
    background: rgba(255,255,255,0.95);
    padding: 10px 12px;
    font: 14px Arial, Helvetica, sans-serif;
    border-radius: 6px;
    box-shadow: 0 0 12px rgba(0,0,0,0.2);
    max-width: 220px;
    text-align: center;
}

.message-info b {
    font-size: 15px;
}

/* Bouton de fermeture du message info (utile sur mobile, ça prend de la place) */
.message-info .fermer-msg {
    position: absolute;
    top: 2px;
    right: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    color: #555;
    line-height: 1;
    padding: 2px 6px;
}

/* ===================== MAP ===================== */
#map {
    width: 100%;
    height: calc(100vh - 46px); /* 46px ~ hauteur du titre */
    touch-action: none; /* Leaflet gère lui-même le pan/zoom tactile */
}

/* ===================== INFO (popup flottante au survol/tap) ===================== */
.info {
    position: absolute;
    pointer-events: none;
    padding: 10px 12px;
    font: 14px Arial, Helvetica, sans-serif;
    background: rgba(255,255,255,0.97);
    box-shadow: 0 0 15px rgba(0,0,0,0.25);
    border-radius: 8px;
    display: none;
    z-index: 1000;
    max-width: 220px;
    line-height: 1.4;
}

/* ===================== LÉGENDE (PC par défaut) ===================== */
.legend {
    background: rgba(255,255,255,0.95);
    padding: 8px 10px;
    border-radius: 6px;
    font: 13px Arial, Helvetica, sans-serif;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    line-height: 18px;
    max-width: 180px;
}

.legend i {
    width: 18px;
    height: 18px;
    float: left;
    margin-right: 8px;
    opacity: 0.85;
}

/* Bouton +/- de zoom plus gros pour les doigts */
.leaflet-touch .leaflet-bar a {
    width: 36px;
    height: 36px;
    line-height: 36px;
    font-size: 20px;
}

/* ===================== MODE TABLETTE ===================== */
@media (max-width: 1024px) {
    .message-info {
        max-width: 190px;
        font-size: 13px;
    }
}

/* ===================== MODE MOBILE (téléphone) ===================== */
@media (max-width: 768px) {

    #titre-periode {
        font-size: 14px;
        padding: 8px 6px;
    }

    #map {
        height: calc(100vh - 40px);
    }

    .legend {
        font-size: 11px;
        line-height: 14px;
        padding: 6px 8px;
        max-width: 92%;
    }

    .legend i {
        width: 14px;
        height: 14px;
        margin-right: 6px;
    }

    /* Centrer la légende en bas sur mobile */
    .leaflet-bottom.leaflet-right {
        right: 50% !important;
        transform: translateX(50%);
    }

    /* Message info repositionné et réduit, pour ne pas gêner la lecture de la carte */
    .message-info {
        max-width: 70vw;
        font-size: 12px;
        padding: 8px 26px 8px 10px;
    }

    .info {
        font-size: 13px;
        max-width: 75vw;
        padding: 8px 10px;
    }
}

/* ===================== TRÈS PETITS ÉCRANS (mobile portrait étroit) ===================== */
@media (max-width: 380px) {
    #titre-periode {
        font-size: 12px;
    }
    .legend {
        font-size: 10px;
        max-width: 85%;
    }
}

/* ===================== MODE PAYSAGE MOBILE ===================== */
@media (max-width: 900px) and (orientation: landscape) {
    #map {
        height: calc(100vh - 34px);
    }
    #titre-periode {
        font-size: 12px;
        padding: 6px 6px;
    }
}
</style>
</head>

<body>

<h2 id="titre-periode" align="center"></h2>

<div id="map"></div>

<script src="Bulletin_meteo.js"></script>

<script>
// ===================== TITRE DYNAMIQUE =====================
function formatDateFR(date) {
    const jour = String(date.getDate()).padStart(2, '0');
    const mois = String(date.getMonth() + 1).padStart(2, '0');
    const annee = date.getFullYear();
    return `${jour}-${mois}-${annee}`;
}

const aujourdHui = new Date();
const demain = new Date(aujourdHui);
demain.setDate(aujourdHui.getDate() + 1);

document.getElementById("titre-periode").innerHTML =
    `Prévision à courte échéance valable du ${formatDateFR(aujourdHui)} à 12H au ${formatDateFR(demain)} à 12H`;

// ===================== DÉTECTION TACTILE =====================
var estTactile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ===================== CARTE =====================
var map = L.map('map', {
    tap: true,            // active le comportement "tap" sur mobile (Leaflet)
    zoomControl: true,
    minZoom: 5,
    maxZoom: 12
}).setView([14.5, -14.5], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

L.control.scale().addTo(map);

// ===================== COULEURS Tmax =====================
function getColorTmax(t) {
    return t > 40 ? '#800026' :
           t > 38 ? '#BD0026' :
           t > 36 ? '#E31A1C' :
           t > 34 ? '#FC4E2A' :
           t > 32 ? '#FD8D3C' :
           t > 30 ? '#FEB24C' :
           t > 28 ? '#FED976' :
                    '#FFEDA0';
}

// ===================== STYLE =====================
function Monstyle(feature) {
    return {
        weight: 2,
        opacity: 1,
        color: 'white',
        dashArray: '3',
        fillOpacity: 0.7,
        fillColor: getColorTmax(feature.properties.Tmax)
    };
}

// ===================== INFO FLOTTANTE =====================
var info = L.control({ position: 'topleft' });

info.onAdd = function () {
    this._div = L.DomUtil.create('div', 'info');
    return this._div;
};

info.update = function (props) {
    if (props) {
        this._div.style.display = 'block';
        this._div.innerHTML =
            '<span style="font-weight:bold; font-size:15px;">Prévisions_météo_du_jour</span><br>' +
            '<b>Département : ' + props.NAME_2 + '</b><br>' +
            '<b>Tmax : 🔴🌡️ </b> ' + props.Tmax + ' °C 🔺<br>' +
            '<b>Tmin : 🔵🌡️ </b> ' + props.Tmin + ' °C 🔻<br>' +
            '<b>Vent : 🧭 </b> ' + props.Vent + '<br>' +
            '<b>Force_vent : 🌬️ </b> ' + props.Force_vent + '<br>' +
            '<b>Etat_ciel : </b> ' + props.Etat_ciel;
    } else {
        this._div.style.display = 'none';
    }
};

info.addTo(map);

// Positionnement de la popup d'info : suit la souris sur PC, suit le doigt sur mobile
function positionnerInfo(x, y) {
    var d = document.querySelector('.info');
    if (!d) return;

    var mapEl = document.getElementById('map');
    var largeurCarte = mapEl.clientWidth;
    var hauteurCarte = mapEl.clientHeight;
    var largeurInfo = d.offsetWidth || 220;
    var hauteurInfo = d.offsetHeight || 120;

    var posX = x + 15;
    var posY = y - 15;

    // Empêche la popup de sortir à droite
    if (posX + largeurInfo > largeurCarte) {
        posX = x - largeurInfo - 15;
    }
    // Empêche la popup de sortir en haut
    if (posY < 0) {
        posY = y + 15;
    }
    // Empêche la popup de sortir en bas
    if (posY + hauteurInfo > hauteurCarte) {
        posY = hauteurCarte - hauteurInfo - 10;
    }

    d.style.left = posX + 'px';
    d.style.top  = posY + 'px';
}

map.on('mousemove', function (e) {
    if (!estTactile) {
        positionnerInfo(e.containerPoint.x, e.containerPoint.y);
    }
});

// ===================== INTERACTIONS =====================
function highlightFeature(e) {
    var layer = e.target;
    layer.setStyle({ weight: 4, color: '#666', fillOpacity: 0.9 });
    layer.bringToFront();
    info.update(layer.feature.properties);
}

function resetHighlight(e) {
    geojson.resetStyle(e.target);
    info.update();
}

function onEachFeature(feature, layer) {
    layer.on({
        mouseover: function (e) {
            if (!estTactile) highlightFeature(e);
        },
        mouseout: function (e) {
            if (!estTactile) resetHighlight(e);
        },
        click: function (e) {
            // Sur mobile/tactile : le tap affiche les infos au lieu du survol
            if (estTactile) {
                // Si une autre région était en surbrillance, on la réinitialise
                geojson.eachLayer(function (l) {
                    if (l !== e.target) geojson.resetStyle(l);
                });
                highlightFeature(e);
                positionnerInfo(e.containerPoint.x, e.containerPoint.y);

                // Masque automatiquement la popup après quelques secondes sur mobile
                clearTimeout(window._infoTimeout);
                window._infoTimeout = setTimeout(function () {
                    resetHighlight(e);
                }, 6000);
            }
            map.fitBounds(e.target.getBounds());
        }
    });
}

// ===================== GEOJSON =====================
var geojson = L.geoJson(Bulletin_meteo, {
    style: Monstyle,
    onEachFeature: onEachFeature
}).addTo(map);

// Sur tactile, un tap sur le fond de carte (hors région) referme l'info
map.on('click', function (e) {
    if (estTactile && !e.originalEvent.target.closest('path')) {
        info.update();
    }
});

// ===================== LÉGENDE RESPONSIVE =====================
var legendTmax = L.control({ position: 'bottomright' });

legendTmax.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    var grades = [28, 30, 32, 34, 36, 38, 40];

    div.innerHTML = '<b>Tmax (°C)</b><br>';

    for (var i = grades.length - 1; i >= 0; i--) {
        var from = grades[i];
        var to = grades[i + 1];

        div.innerHTML +=
            '<i style="background:' + getColorTmax(from + 1) + '"></i> ' +
            (to ? from + ' – ' + to : '> ' + from) + '<br>';
    }

    L.DomEvent.disableClickPropagation(div);
    return div;
};

legendTmax.addTo(map);

// ===================== LOGO =====================
L.imageOverlay('logo.png', [
    [16.5, -19.0],
    [15.5, -18.0]
], { opacity: 0.8 }).addTo(map);

// ===================== MESSAGE D'INFORMATION (HAUT DROIT) =====================
var messageInfo = L.control({ position: 'topright' });

messageInfo.onAdd = function () {
    var div = L.DomUtil.create('div', 'message-info');
    div.style.position = 'relative';

    var texte = estTactile
        ? 'Touchez une région pour voir les prévisions du jour !'
        : 'Survoler une région pour voir les prévisions du jour !';

    div.innerHTML =
        '<span class="fermer-msg" title="Fermer">&times;</span>' +
        '<b>ℹ️ Information</b><br>' +
        texte + '<br>' +
        '<b>Merci !!</b>';

    // Empêche la carte de bouger quand on clique/touche dessus
    L.DomEvent.disableClickPropagation(div);

    // Permet de fermer le message (pratique sur petit écran mobile)
    var btnFermer = div.querySelector('.fermer-msg');
    L.DomEvent.on(btnFermer, 'click', function () {
        div.style.display = 'none';
    });

    return div;
};

messageInfo.addTo(map);

// ===================== AJUSTEMENT AUTOMATIQUE AU CHANGEMENT D'ORIENTATION =====================
window.addEventListener('resize', function () {
    map.invalidateSize();
});
window.addEventListener('orientationchange', function () {
    setTimeout(function () { map.invalidateSize(); }, 200);
});
</script>
</body>
</html>
